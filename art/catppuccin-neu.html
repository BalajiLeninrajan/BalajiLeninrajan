<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/BalajiLeninrajan/catppuccin-neu@v1.0.0/css/index.css"
      rel="stylesheet"
    />
    <meta name="robots" content="noindex" />
    <link href="scene.css" rel="stylesheet" />
    <script src="scene.js"></script>
    <style>
      /* The docs' "First look" demo plus a segmented control. */
      .live-dot { animation-duration: 2s; }

      /* On hover each control takes its turn: the primary hovers pink and
         presses, Export presses, and the switch flips on. The primary
         and the paddle restate the recipe's own fill: the primary moves
         --cn-fill so its ramp and grain stay, and the paddle paints the
         ramp and the on bar when on. */
      @keyframes press-primary {
        0%, 4% { transform: none; --cn-fill: var(--mauve); box-shadow: var(--cn-plate), var(--hard-extra); }
        10% { transform: translate(-1px, -1px); --cn-fill: var(--pink); }
        16%, 22% { transform: translate(2px, 2px); --cn-fill: var(--pink); box-shadow: var(--cn-plate-half), var(--hard-extra); }
        30% { transform: none; --cn-fill: var(--pink); box-shadow: var(--cn-plate), var(--hard-extra); }
        38%, 100% { transform: none; --cn-fill: var(--mauve); }
      }
      @keyframes press-secondary {
        0%, 30% { transform: none; border-color: var(--edge); box-shadow: var(--cn-plate), var(--hard-extra); }
        36% { transform: translate(-1px, -1px); border-color: color-mix(in srgb, var(--mauve) 45%, var(--edge)); }
        42%, 48% { transform: translate(2px, 2px); box-shadow: var(--cn-plate-half), var(--hard-extra); border-color: color-mix(in srgb, var(--mauve) 45%, var(--edge)); }
        56% { transform: none; box-shadow: var(--cn-plate), var(--hard-extra); }
        62%, 100% { border-color: var(--edge); }
      }
      @keyframes flip {
        0%, 64% {
          translate: 0 0; border-color: var(--control-edge); background-color: var(--cn-surface-raised); background-image: none;
          box-shadow: var(--neu-raised-soft); transform: perspective(120px) rotateY(16deg);
          animation-timing-function: var(--ease-spring);
        }
        78%, 100% {
          translate: 23px 0; border-color: var(--mauve); --cn-fill: var(--mauve); background-color: var(--cn-fill);
          background-image: linear-gradient(var(--cn-fg-on-accent), var(--cn-fg-on-accent)), var(--cn-fill-ramp);
          background-size: 2px 8px, auto; background-position: center; background-repeat: no-repeat;
          box-shadow: var(--cn-switch-glow), var(--cn-gloss-inset);
          transform: perspective(120px) rotateY(-16deg);
        }
      }
      .btn-primary { animation: press-primary 1.8s both; }
      .btn-secondary { animation: press-secondary 1.8s both; }
      .switch::after { animation: flip 1.8s both; }
    </style>
  </head>
  <body>
    <div class="cn-stack cn-gap-16" style="justify-items: center">
      <div class="segmented" style="width: 264px; grid-template-columns: repeat(3, 1fr)">
        <button><b>Day</b></button>
        <button class="active"><b>Week</b></button>
        <button><b>Month</b></button>
      </div>
      <div class="cn-row cn-gap-16">
        <button class="btn btn-primary">New invoice</button>
        <button class="btn btn-secondary">Export</button>
      </div>
      <div class="cn-row cn-gap-12">
        <span class="chip"><span class="live-dot"></span> 3 online</span>
        <span class="tag cn-tone-green">Paid</span>
        <input type="checkbox" class="switch" aria-label="Switch" />
        <input type="checkbox" class="checkbox" checked aria-label="Checkbox" />
      </div>
    </div>
  </body>
</html>
