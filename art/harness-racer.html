<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="loop" content="4800" />
    <meta name="still" content="0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/BalajiLeninrajan/catppuccin-neu@v0.4.1/css/index.css"
      rel="stylesheet"
    />
    <meta name="robots" content="noindex" />
    <link href="scene.css" rel="stylesheet" />
    <script src="scene.js"></script>
    <style>
      /* harness racer mid-race: each lane's mark, name, and live tok/s
         (the race page's stat.is-live) over a progress track. Speeds rise
         and fall on smooth curves that end where they start, so the lead
         changes hands and the loop has no seam. */
      .hr { width: 288px; }
      .hr-lane { display: grid; grid-template-columns: 28px minmax(0, 1fr) 40px; align-items: center; gap: 10px; padding: 7px 0; }
      .hr-lane .mark { color: var(--crust); }
      .hr-track { display: grid; gap: 5px; }
      .hr-lane > .cn-value { text-align: right; font-size: 15px; }

      /* Only the numbers restyle each frame. A fill is the full track slid
         left by its gap, which the compositor animates on its own. The slide
         is on a plain wrapper so the fill, which the recipe makes costly to
         restyle, sits out the frames the numbers force; animating a width or
         an inherited property here restyled whole lanes every frame. */
      @property --v { syntax: "<integer>"; inherits: false; initial-value: 0; }
      .progress-track { overflow: hidden; }
      .progress-track > i { display: block; height: 100%; border-radius: inherit; }
      .cn-value { counter-reset: v var(--v); }
      .cn-value::after { content: counter(v); }
      .hr-lane .progress-track > i, .hr-lane .cn-value { animation: 4.8s ease-in-out infinite; }
      .l1 .progress-track > i { animation-name: w1; } .l1 .cn-value { animation-name: v1; }
      .l2 .progress-track > i { animation-name: w2; } .l2 .cn-value { animation-name: v2; }
      .l3 .progress-track > i { animation-name: w3; } .l3 .cn-value { animation-name: v3; }
      .l4 .progress-track > i { animation-name: w4; } .l4 .cn-value { animation-name: v4; }
      @keyframes w1 { 0%, 100% { translate: -30%; } 25% { translate: -14%; } 50% { translate: -36%; } 75% { translate: -20%; } }
      @keyframes v1 { 0%, 100% { --v: 98; } 25% { --v: 120; } 50% { --v: 90; } 75% { --v: 112; } }
      @keyframes w2 { 0%, 100% { translate: -18%; } 25% { translate: -32%; } 50% { translate: -12%; } 75% { translate: -34%; } }
      @keyframes v2 { 0%, 100% { --v: 115; } 25% { --v: 95; } 50% { --v: 123; } 75% { --v: 92; } }
      @keyframes w3 { 0%, 100% { translate: -48%; } 33% { translate: -38%; } 66% { translate: -52%; } }
      @keyframes v3 { 0%, 100% { --v: 73; } 33% { --v: 87; } 66% { --v: 67; } }
      @keyframes w4 { 0%, 100% { translate: -60%; } 50% { translate: -46%; } }
      @keyframes v4 { 0%, 100% { --v: 56; } 50% { --v: 76; } }
    </style>
  </head>
  <body>
    <div class="hr" aria-hidden="true">
      <div class="hr-lane l1" style="--accent: var(--peach)">
        <span class="mark">C</span>
        <div class="hr-track"><strong class="cn-name">Claude Code</strong><div class="progress-track"><i><span></span></i></div></div>
        <b class="cn-value"></b>
      </div>
      <div class="hr-lane l2" style="--accent: var(--teal)">
        <span class="mark">O</span>
        <div class="hr-track"><strong class="cn-name">OpenCode</strong><div class="progress-track"><i><span></span></i></div></div>
        <b class="cn-value"></b>
      </div>
      <div class="hr-lane l3" style="--accent: var(--blue)">
        <span class="mark">X</span>
        <div class="hr-track"><strong class="cn-name">Codex CLI</strong><div class="progress-track"><i><span></span></i></div></div>
        <b class="cn-value"></b>
      </div>
      <div class="hr-lane l4" style="--accent: var(--yellow)">
        <span class="mark">G</span>
        <div class="hr-track"><strong class="cn-name">Grok CLI</strong><div class="progress-track"><i><span></span></i></div></div>
        <b class="cn-value"></b>
      </div>
    </div>
  </body>
</html>
