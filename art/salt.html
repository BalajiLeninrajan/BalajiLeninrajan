<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="loop" content="1" />
    <meta name="still" content="0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/BalajiLeninrajan/catppuccin-neu@v0.4.1/css/index.css"
      rel="stylesheet"
    />
    <meta name="robots" content="noindex" />
    <link href="scene.css" rel="stylesheet" />
    <script src="scene.js"></script>
    <style>
      /* The tally salt publishes: the total, how salty that makes you, and
         the words you reach for most, each with its share of the total. */
      .st { width: 272px; padding: 14px 16px; }
      .st-head { display: flex; align-items: center; justify-content: space-between; }
      .st-total { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 10px; }
      .st-total .cn-value-lg { color: var(--text); }
      .st-word { display: grid; grid-template-columns: 44px minmax(0, 1fr) 30px; align-items: center; gap: 10px; padding: 3px 0; }
      .st-word > code { color: var(--subtext-1); font: 600 12px/1 var(--mono); }
      .st-word > b { text-align: right; color: var(--overlay-2); font: 500 12px/1 var(--sans); font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div class="panel st" aria-hidden="true">
      <div class="st-head">
        <span class="cn-microlabel">Your salt</span>
        <span class="chip-tone cn-tone-peach">Very salty</span>
      </div>
      <div class="st-total">
        <b class="cn-value-lg">1,337</b>
        <span class="cn-meta">swears at your agents</span>
      </div>
      <div class="st-word" style="--accent: var(--red)">
        <code>f*ck</code><div class="progress-track"><span style="width: 100%"></span></div><b>612</b>
      </div>
      <div class="st-word" style="--accent: var(--peach)">
        <code>sh*t</code><div class="progress-track"><span style="width: 47%"></span></div><b>288</b>
      </div>
      <div class="st-word" style="--accent: var(--yellow)">
        <code>wtf</code><div class="progress-track"><span style="width: 33%"></span></div><b>201</b>
      </div>
      <div class="st-word" style="--accent: var(--mauve)">
        <code>ffs</code><div class="progress-track"><span style="width: 15%"></span></div><b>94</b>
      </div>
    </div>
  </body>
</html>
