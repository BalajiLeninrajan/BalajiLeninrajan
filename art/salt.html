<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="loop" content="9600" />
    <meta name="still" content="0.1" />
    <meta name="rate" content="0.5" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/BalajiLeninrajan/catppuccin-neu@v0.4.1/css/index.css"
      rel="stylesheet"
    />
    <meta name="robots" content="noindex" />
    <link href="scene.css" rel="stylesheet" />
    <script src="scene.js"></script>
    <style>
      /* salt's drift (packages/site/public/styles.css, drift.js) on its own:
         swear words bouncing like a DVD logo. Each axis is a triangle wave
         whose period divides the loop. On each sideways bounce a word takes
         the next hue and flashes bright, then fades back, as drift.js does. */
      .drift { position: fixed; inset: 0; overflow: hidden; }
      .drift span {
        position: absolute; top: 0; left: 0;
        font-family: var(--mono); font-weight: 800; letter-spacing: -.02em; white-space: nowrap; line-height: 1;
        color: var(--mauve);
        text-shadow: 0 2px 16px color-mix(in srgb, currentColor 35%, transparent);
        animation:
          dx 4.8s linear infinite alternate,
          dy var(--ty, 4.8s) linear infinite alternate,
          hue 9.6s step-end infinite,
          flash 4.8s cubic-bezier(.33, .6, .2, 1) infinite;
        animation-delay: var(--d), var(--dy-d, 0s), var(--d), var(--d);
      }
      @keyframes dx { from { left: var(--x0); } to { left: var(--x1); } }
      @keyframes dy { from { top: var(--y0); } to { top: var(--y1); } }
      @keyframes hue { 0% { color: var(--c1); } 50% { color: var(--c2); } }
      @keyframes flash { 0% { opacity: .75; } 70%, 100% { opacity: .3; } }
    </style>
  </head>
  <body>
    <div class="drift" aria-hidden="true">
      <span style="font-size: 30px; --x0: 4px; --x1: 186px; --y0: 6px; --y1: 150px; --d: -1.1s; --c1: var(--mauve); --c2: var(--lavender)">f*ckwit</span>
      <span style="font-size: 40px; --x0: 244px; --x1: 6px; --y0: 120px; --y1: 40px; --ty: 2.4s; --d: -3.3s; --c1: var(--blue); --c2: var(--mauve)">wtf</span>
      <span style="font-size: 26px; --x0: 10px; --x1: 246px; --y0: 168px; --y1: 70px; --d: -2.2s; --dy-d: -1.6s; --c1: var(--sky); --c2: var(--mauve)">damn</span>
      <span style="font-size: 28px; --x0: 246px; --x1: 20px; --y0: 8px; --y1: 100px; --ty: 2.4s; --d: -.4s; --dy-d: -.9s; --c1: var(--lavender); --c2: var(--sky)">sh*t</span>
      <span style="font-size: 22px; --x0: 200px; --x1: 8px; --y0: 172px; --y1: 120px; --ty: 1.6s; --d: -4.1s; --c1: var(--mauve); --c2: var(--blue)">b*llocks</span>
      <span style="font-size: 24px; --x0: 120px; --x1: 270px; --y0: 60px; --y1: 172px; --d: -2.8s; --dy-d: -3.9s; --c1: var(--blue); --c2: var(--lavender)">ffs</span>
    </div>
  </body>
</html>
