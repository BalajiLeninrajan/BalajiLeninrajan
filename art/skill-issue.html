<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/BalajiLeninrajan/catppuccin-neu@v0.4.1/css/index.css"
      rel="stylesheet"
    />
    <meta name="robots" content="noindex" />
    <link href="scene.css" rel="stylesheet" />
    <script src="scene.js"></script>
    <style>
      /* The rejection, opened: who it's from, how long it took, and a
         subject line for a job you never applied to. On hover the
         rejection is stamped on it. */
      .si { position: relative; width: 280px; }
      .si-from { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
      .si-from .mark { --accent: var(--red); }
      .si-from > div { display: grid; gap: 2px; min-width: 0; }
      .si-addr { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .si-subject { margin: 12px 0 4px; color: var(--text); font: 600 13px/1.3 var(--sans); }
      .si-body { margin: 0 0 10px; color: var(--subtext-0); font: 400 12px/1.5 var(--sans); }
      .si-stamp {
        position: absolute; right: -14px; bottom: 6px;
        padding: 1px 10px; border: 2.5px solid var(--red); border-radius: 6px;
        color: var(--red); font: 800 20px/1.3 var(--sans); letter-spacing: .08em;
        rotate: -10deg;
        animation: si-stamp .8s both;
      }
      @keyframes si-stamp {
        0%, 15% { opacity: 0; scale: 2.4; animation-timing-function: var(--ease-in); }
        55% { opacity: .9; scale: .94; animation-timing-function: var(--ease-out); }
        100% { opacity: .9; scale: 1; }
      }
    </style>
  </head>
  <body>
    <div class="si" aria-hidden="true">
      <div class="si-from">
        <span class="mark">E</span>
        <div><strong class="cn-name">Evil Company Inc.</strong><span class="cn-meta si-addr">no-reply@evil.inc</span></div>
        <span class="cn-meta">38h later</span>
      </div>
      <p class="si-subject">Re: Senior Vibe Engineer</p>
      <p class="si-body">After careful review, we've decided to move forward with candidates who applied.</p>
      <span class="cn-meta">No application required</span>
      <span class="si-stamp">REJECTED</span>
    </div>
  </body>
</html>
